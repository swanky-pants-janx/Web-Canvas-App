<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Canvas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Projects</span>
      <button id="btn-toggle-sidebar" title="Collapse sidebar">&lsaquo;</button>
    </div>
    <div id="project-list"></div>
    <div id="sidebar-footer">
      <a id="btn-dashboard" href="projects.html" title="Back to project dashboard">
        <span class="dashboard-icon">&#8592;</span>
        Dashboard
      </a>
    </div>
  </div>
  <button id="btn-expand-sidebar" title="Expand sidebar">&rsaquo;</button>

  <div id="toolbar">
    <div id="main-tb">
      <button id="btn-image"><span class="btn-icon" style="--icon:url('icons web canvas/images.svg')"></span>Image</button>
      <button id="btn-text"><span class="btn-icon" style="--icon:url('icons web canvas/text.svg')"></span>Text</button>
      <button id="btn-palette"><span class="btn-icon" style="--icon:url('icons web canvas/swatch.svg')"></span>Palette</button>
      <button id="btn-folder"><span class="btn-icon" style="--icon:url('icons web canvas/folder.svg')"></span>Folder</button>
      <button id="btn-video"><span class="btn-icon" style="--icon:url('icons web canvas/video.svg')"></span>Video</button>
      <button id="btn-frame">▣ Frame</button>
      <div class="divider"></div>
      <button id="btn-grid"><span class="btn-icon" style="--icon:url('icons web canvas/snap.svg')"></span>Snap</button>
      <button id="btn-zoom-fit"><span class="btn-icon" style="--icon:url('icons web canvas/zoom to fit.svg')"></span>Zoom to fit</button>
      <button id="btn-minimap"><span class="btn-icon" style="--icon:url('icons web canvas/mini-map.svg')"></span>Mini-map</button>
      <div class="divider"></div>
      <button id="btn-help">?</button>
    </div>
    <div id="text-tb" style="display:none"></div>
  </div>

  <div id="font-picker"></div>

  <div id="minimap">
    <canvas id="minimap-canvas"></canvas>
    <div id="minimap-viewport"></div>
  </div>

  <div id="canvas">
    <div id="world"></div>
  </div>

  <div id="drop-hint">Drop image onto canvas</div>
  <input type="file" id="file-input" accept="image/*" multiple style="display:none">

  <script type="module" src="canvas.js"></script>
</body>
</html>
