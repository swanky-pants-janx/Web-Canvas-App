<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Canvas — Sign in</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div id="login-wrap">
    <div id="login-box">
      <div class="login-brand">Web Canvas</div>
      <p class="login-sub">Sign in to your workspace</p>
      <form id="login-form" autocomplete="off">
        <div class="login-field">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" placeholder="Enter username" autocomplete="username">
        </div>
        <div class="login-field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password">
        </div>
        <div id="login-error"></div>
        <button type="submit" id="login-btn">Sign in</button>
      </form>
    </div>
  </div>

  <script>
    /* If already authenticated, skip straight to the dashboard */
    if (sessionStorage.getItem('wc_auth') === '1') {
      location.replace('projects.html');
    }

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var user = document.getElementById('login-username').value.trim();
      var pass = document.getElementById('login-password').value;
      var err  = document.getElementById('login-error');
      if (user === 'user' && pass === '123') {
        err.textContent = '';
        sessionStorage.setItem('wc_auth', '1');
        location.replace('projects.html');
      } else {
        err.textContent = 'Incorrect username or password.';
        document.getElementById('login-password').value = '';
        document.getElementById('login-password').focus();
      }
    });
  </script>
</body>
</html>
