<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Canvas — Sign in</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div id="login-wrap">
    <div id="login-box">
      <div class="login-brand">Web Canvas</div>
      <p class="login-sub">Sign in to your workspace</p>
      <form id="login-form" autocomplete="off">
        <div class="login-field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="Enter email" autocomplete="email">
        </div>
        <div class="login-field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password">
        </div>
        <div id="login-error"></div>
        <button type="submit" id="login-btn">Sign in</button>
      </form>
      <div class="login-divider"><span>or</span></div>
      <button id="demo-btn">Try demo</button>
    </div>
  </div>

  <script type="module">
    import { account } from './appwrite.js';

    /* If already authenticated, skip straight to the dashboard */
    try {
      await account.get();
      location.replace('projects.html');
    } catch (_) { /* not logged in, show form */ }

    document.getElementById('demo-btn').addEventListener('click', () => {
      sessionStorage.setItem('wc_demo', '1');
      location.href = 'index.html';
    });

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass  = document.getElementById('login-password').value;
      const err   = document.getElementById('login-error');
      const btn   = document.getElementById('login-btn');

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      err.textContent = '';

      try {
        await account.createEmailPasswordSession(email, pass);
        location.replace('projects.html');
      } catch (e) {
        err.textContent = e.message || 'Incorrect email or password.';
        document.getElementById('login-password').value = '';
        document.getElementById('login-password').focus();
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
