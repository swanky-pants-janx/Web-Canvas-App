<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Canvas — Projects</title>
  <link rel="stylesheet" href="projects.css">
</head>
<body>

  <header id="ps-header">
    <span class="ps-brand">Web Canvas</span>
    <button id="btn-logout">Sign out</button>
  </header>

  <main id="ps-main">
    <h1 class="ps-title">Your Projects</h1>
    <div id="project-cards"></div>
  </main>

  <!-- Rename modal -->
  <div id="rename-modal">
    <div id="rename-box">
      <p class="rename-label">Rename project</p>
      <input type="text" id="rename-input" maxlength="60">
      <div class="rename-actions">
        <button id="rename-cancel">Cancel</button>
        <button id="rename-confirm">Save</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { account, databases, DB_ID, COLL_ID, Permission, Role } from './appwrite.js';

    /* ── Guard ── */
    let currentUser;
    try {
      currentUser = await account.get();
    } catch (_) {
      location.replace('login.html');
    }

    /* ── Logout ── */
    document.getElementById('btn-logout').addEventListener('click', async function () {
      await account.deleteSession('current');
      location.replace('login.html');
    });

    /* ── Rename modal ── */
    const renameModal   = document.getElementById('rename-modal');
    const renameInput   = document.getElementById('rename-input');
    const renameConfirm = document.getElementById('rename-confirm');
    const renameCancel  = document.getElementById('rename-cancel');
    let _onRenameConfirm = null;

    function openRename(currentName, onConfirm) {
      renameInput.value = currentName;
      _onRenameConfirm = onConfirm;
      renameModal.classList.add('visible');
      setTimeout(() => { renameInput.select(); renameInput.focus(); }, 40);
    }
    function closeRename() {
      renameModal.classList.remove('visible');
      _onRenameConfirm = null;
    }
    renameConfirm.addEventListener('click', () => {
      const val = renameInput.value.trim();
      if (val && _onRenameConfirm) _onRenameConfirm(val);
      closeRename();
    });
    renameCancel.addEventListener('click', closeRename);
    renameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') renameConfirm.click();
      if (e.key === 'Escape') closeRename();
    });
    renameModal.addEventListener('mousedown', e => { if (e.target === renameModal) closeRename(); });

    /* ── Render ── */
    async function render() {
      const container = document.getElementById('project-cards');
      container.innerHTML = '<div style="padding:24px;color:var(--text-muted)">Loading…</div>';

      const res = await databases.listDocuments(DB_ID, COLL_ID);
      const list = res.documents;

      container.innerHTML = '';

      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'ps-card';

        const icon = document.createElement('div');
        icon.className = 'ps-card-icon';
        icon.textContent = '🗂';

        const name = document.createElement('div');
        name.className = 'ps-card-name';
        name.textContent = p.name;

        const actions = document.createElement('div');
        actions.className = 'ps-card-actions';

        name.addEventListener('dblclick', e => {
          e.stopPropagation();
          openRename(p.name, async newName => {
            await databases.updateDocument(DB_ID, COLL_ID, p.$id, { name: newName });
            render();
          });
        });

        const delBtn = document.createElement('button');
        delBtn.className = 'ps-action-btn ps-action-delete';
        delBtn.title = 'Delete';
        delBtn.textContent = '×';
        delBtn.disabled = list.length <= 1;
        delBtn.addEventListener('click', async e => {
          e.stopPropagation();
          if (list.length <= 1) return;
          if (!confirm('Delete "' + p.name + '"? This cannot be undone.')) return;
          await databases.deleteDocument(DB_ID, COLL_ID, p.$id);
          render();
        });

        actions.appendChild(delBtn);
        card.appendChild(icon);
        card.appendChild(name);
        card.appendChild(actions);

        card.addEventListener('click', () => {
          sessionStorage.setItem('wc_active_proj', p.$id);
          location.href = 'index.html';
        });

        container.appendChild(card);
      });

      /* New project card */
      const newCard = document.createElement('div');
      newCard.className = 'ps-card ps-card-new';
      newCard.innerHTML = '<span class="ps-new-icon">+</span><span>New project</span>';
      newCard.addEventListener('click', async () => {
        const name = 'Project ' + (list.length + 1);
        const doc = await databases.createDocument(DB_ID, COLL_ID, 'unique()', { name, state: null }, [
          Permission.read(Role.user(currentUser.$id)),
          Permission.update(Role.user(currentUser.$id)),
          Permission.delete(Role.user(currentUser.$id)),
        ]);
        sessionStorage.setItem('wc_active_proj', doc.$id);
        location.href = 'index.html';
      });
      container.appendChild(newCard);
    }

    render();
  </script>
</body>
</html>
